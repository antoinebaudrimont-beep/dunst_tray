# Reference settings for ~/.config/dunst/dunstrc.
#
# The installer deliberately does not edit the user's working Dunst config.
# Merge settings manually only after making a backup.

[global]
    origin = top-right
    width = 360
    height = (0, 140)
    notification_limit = 4
    indicate_hidden = yes
    corner_radius = 14
    icon_position = left
    stack_duplicates = true
    history_length = 100

# A stack tag keeps Walite popups compact. dunst-tray's passive monitor sees
# every Notify call before Dunst applies this rule, so local history is intact.
[walite]
    appname = "walite"
    set_stack_tag = "walite"
    timeout = 7

