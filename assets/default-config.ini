[history]
# Maximum number of notification records retained locally.
limit = 100
# Number initially shown when an application group is expanded.
page_size = 5

[panel]
width = 380
height = 680
opacity = 97
corner_radius = 14
show_icons = true
margin_top = 48
margin_right = 16

[capture]
# Passive monitoring never owns org.freedesktop.Notifications.
monitor_dbus = true

