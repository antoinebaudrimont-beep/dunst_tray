[global]
    follow = none
    origin = top-right
    offset = (24, 56)
    width = 300
    font = Sans 10
    frame_width = 1
    frame_color = "#576777"
    background = "#202a36"
    foreground = "#f4f4f4"
    enable_posix_regex = true

[urgency_low]
    timeout = 1

[urgency_normal]
    timeout = 1

[urgency_critical]
    timeout = 1
